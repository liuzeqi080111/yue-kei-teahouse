<!doctype html><html lang="zh-Hans"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>街坊动作试镜</title><style>
*{box-sizing:border-box}body{margin:0;background:#24231f;color:#f4e9d4;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1040px;padding:clamp(16px,4vw,48px);margin:auto}h1{font:500 clamp(28px,4vw,43px) KaiTi,serif;margin:8px 0}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:#e6c698}select,button{font:inherit;padding:8px;background:#493e35;color:white;border:1px solid #aa9680;border-radius:5px}label{display:inline-flex;align-items:center;gap:12px}video{display:block;width:100%;background:#161612;margin:14px 0 8px;aspect-ratio:2}p{margin:7px 0 16px}#take{font-size:20px;margin:12px 0}#failure{color:#ffbba4}
</style></head><body><main><nav><a href="./face-review.html">新版人物对白近景</a><a href="./story-preview.html?story=reunion">新年主线 · 预埋你嗰份</a><a href="./story-preview.html?story=table">A 今晚搭张台</a></nav><h1>街坊动作试镜</h1><p>双人交接用两个机位看手和衣服。下方为已录制的动作试镜。新版口型请打开「新版人物对白近景」。</p><label>角色 <select></select></label><div id="take"></div><video controls playsinline preload="auto"></video><span id="failure" role="status"></span></main><script type="module">
import {rehearsalCast} from './rehearsal-cast.js';
const menu=document.querySelector('select'),video=document.querySelector('video');
for(const [id,[name]] of Object.entries(rehearsalCast))menu.add(new Option(name,id));
function show(){const id=menu.value;video.src='assets/rehearsal-'+id+'.mp4';document.querySelector('#failure').textContent='';document.querySelector('#take').textContent=rehearsalCast[id][1];history.replaceState(null,'','#'+id);}
video.onerror=()=>document.querySelector('#failure').textContent='视频加载失败，请刷新后重试。';
if(Object.hasOwn(rehearsalCast,location.hash.slice(1)))menu.value=location.hash.slice(1);
menu.onchange=()=>{show();video.play().catch(()=>{});};show();
</script></body></html>
